<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Verification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .success {
      color: #4CAF50;
    }
    .error {
      color: #f44336;
    }
    .loading {
      color: #FFC107;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="status" class="loading">
      <h2>Processing email verification...</h2>
      <p>Please wait while we verify your email.</p>
    </div>
  </div>

<script>
console.log('Redirect page loaded');
console.log('Current URL:', window.location.href);
console.log('URL search params:', window.location.search);

const urlParams = new URLSearchParams(window.location.search);
const statusDiv = document.getElementById('status');

// Check if this is a Supabase email confirmation callback
const accessToken = urlParams.get('access_token');
const refreshToken = urlParams.get('refresh_token');
const tokenType = urlParams.get('token_type');
const type = urlParams.get('type');

console.log('Tokens found:', {
  access_token: accessToken ? 'present' : 'missing',
  refresh_token: refreshToken ? 'present' : 'missing',
  token_type: tokenType,
  type: type
});

function updateStatus(message, className) {
  statusDiv.innerHTML = `<h2>${message}</h2>`;
  statusDiv.className = className;
}

function redirectToApp(status, tokens = null) {
  const baseUrl = 'myapp://confirmation/';
  let deepLink;
  
  if (tokens && status === 'confirmed') {
    // Include tokens in the deep link for successful confirmation
    const tokenParams = new URLSearchParams({
      access_token: tokens.access_token,
      refresh_token: tokens.refresh_token,
      token_type: tokens.token_type || 'bearer',
      type: tokens.type || 'signup'
    });
    deepLink = `${baseUrl}${status}?${tokenParams.toString()}`;
  } else {
    deepLink = `${baseUrl}${status}`;
  }
  
  console.log('Redirecting to:', deepLink);
  
  try {
    window.location.replace(deepLink);
  } catch (error) {
    console.error('Replace failed:', error);
    try {
      window.location.href = deepLink;
    } catch (error2) {
      console.error('Href assignment failed:', error2);
      updateStatus('Failed to redirect to app. Please open the app manually.', 'error');
    }
  }
}

// Handle different scenarios
if (accessToken && refreshToken && type === 'signup') {
  // This is a successful Supabase email confirmation
  console.log('Email confirmation successful');
  updateStatus('Email verified successfully! Redirecting to app...', 'success');
  
  const tokens = {
    access_token: accessToken,
    refresh_token: refreshToken,
    token_type: tokenType,
    type: type
  };
  
  setTimeout(() => {
    redirectToApp('confirmed', tokens);
  }, 1500);
  
} else if (urlParams.get('error')) {
  // Handle error cases
  const error = urlParams.get('error');
  const errorDescription = urlParams.get('error_description');
  console.log('Email confirmation error:', error, errorDescription);
  
  updateStatus(`Verification failed: ${errorDescription || error}`, 'error');
  
  setTimeout(() => {
    redirectToApp('failed');
  }, 3000);
  
} else if (urlParams.get('confirmation') === 'confirmed') {
  // Legacy confirmation parameter (your original setup)
  console.log('Legacy confirmation detected');
  updateStatus('Email verified! Redirecting to app...', 'success');
  
  setTimeout(() => {
    redirectToApp('confirmed');
  }, 1500);
  
} else if (urlParams.get('status')) {
  // Handle payment status (keeping your original payment logic)
  const status = urlParams.get('status');
  console.log('Payment status:', status);
  
  setTimeout(() => {
    const deepLink = `myapp://payment/${status}`;
    console.log('Redirecting to payment:', deepLink);
    try {
      window.location.replace(deepLink);
    } catch (error) {
      window.location.href = deepLink;
    }
  }, 1500);
  
} else {
  // Check if we have any Supabase parameters even without full tokens
  const hasSupabaseParams = urlParams.get('type') || urlParams.get('token_hash') || urlParams.get('access_token');
  
  if (hasSupabaseParams) {
    console.log('Partial Supabase callback detected, treating as confirmation');
    updateStatus('Processing email verification...', 'loading');
    
    setTimeout(() => {
      redirectToApp('confirmed');
    }, 2000);
  } else {
    // Unknown or invalid link
    console.log('Unknown redirect type');
    updateStatus('Invalid verification link.', 'error');
    
    setTimeout(() => {
      redirectToApp('failed');
    }, 3000);
  }
}

// Fallback redirect after 10 seconds
setTimeout(() => {
  if (document.visibilityState === 'visible') {
    updateStatus('Redirecting to app...', 'loading');
    redirectToApp('timeout');
  }
}, 10000);
</script>
</body>
</html>
